<script>
const overlay = document.getElementById('overlay');
let ticking = false;

function updateOverlay() {
  const scrollY = window.scrollY;
  const maxScroll = window.innerHeight * 1.1;
  const progress = Math.min(scrollY / maxScroll, 1);
  const opacity = 0.15 + progress * 0.75;
  overlay.style.background = 'rgba(0,0,0,' + opacity + ')';
  ticking = false;
}

window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(updateOverlay);
    ticking = true;
  }
});

updateOverlay();

const menuBtn = document.getElementById('menuBtn');
const menuPopup = document.getElementById('menuPopup');
const toast = document.getElementById('toast');

menuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  menuPopup.classList.toggle('open');
});

document.addEventListener('click', (e) => {
  if (!menuPopup.contains(e.target) && e.target !== menuBtn) {
    menuPopup.classList.remove('open');
  }
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

document.getElementById('copyLinkBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(window.location.href).then(() => {
    showToast('Link copied');
  }).catch(() => {
    showToast('Unable to copy');
  });
  menuPopup.classList.remove('open');
});

document.getElementById('shareBtn').addEventListener('click', () => {
  if (navigator.share) {
    navigator.share({ title: document.title, url: window.location.href }).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => showToast('Link copied'));
  }
  menuPopup.classList.remove('open');
});

const cards = document.querySelectorAll(".link-btn");

const observer = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

        if(entry.isIntersecting){

            const delay = [...cards].indexOf(entry.target) * 120;

            setTimeout(() => {
                entry.target.classList.add("show");
            }, delay);

            observer.unobserve(entry.target);

        }

    });

},{
    threshold:0.2
});

cards.forEach(card => observer.observe(card));
</script>
